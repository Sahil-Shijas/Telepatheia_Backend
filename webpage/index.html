<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telepatheia - Class 10D 🤖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121218;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-card {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      background: #1e1e2a;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #2d2d3f;
    }
    .header {
      padding: 20px;
      background: #252536;
      border-bottom: 1px solid #2d2d3f;
      text-align: center;
      border-radius: 16px 16px 0 0;
    }
    .header h2 { font-size: 1.2rem; color: #4da6ff; }
    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .bot { background: #2b2b3d; align-self: flex-start; color: #e1e1e6; }
    .user { background: #007bff; align-self: flex-end; color: #fff; }
    .input-box {
      padding: 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #2d2d3f;
      background: #252536;
      border-radius: 0 0 16px 16px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #3d3d52;
      border-radius: 8px;
      background: #121218;
      color: #fff;
      outline: none;
    }
    button {
      padding: 12px 20px;
      background: #007bff;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="header">
      <h2>Telepatheia - Class 10D 🤖</h2>
    </div>
    <div class="messages" id="chat">
      <div class="msg bot">Hello! Think of anyone in Class 10D and type <strong>Start game</strong> to begin!</div>
    </div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="Type your answer..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Relative path connects automatically when hosted on the same Render server
    const RENDER_WEBHOOK_URL = "/webhook";

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      try {
        const response = await fetch(RENDER_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            queryResult: {
              queryText: text,
              intent: { displayName: text.toLowerCase().includes("start") ? "game_start" : "user_response" }
            }
          })
        });

        const data = await response.json();
        const reply = data.fulfillmentText || (data.fulfillmentMessages && data.fulfillmentMessages[0]?.text?.text[0]) || "No response received.";
        appendMessage(reply, "bot");
      } catch (err) {
        appendMessage("⚠️ Could not connect to Render backend. Make sure the server is awake!", "bot");
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById("chat");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerHTML = text;
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
