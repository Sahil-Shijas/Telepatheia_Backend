<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telepatheia - Class 10D 🤖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121218;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-card {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      background: #1e1e2a;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #2d2d3f;
    }
    .header {
      padding: 20px;
      background: #252536;
      border-bottom: 1px solid #2d2d3f;
      text-align: center;
      border-radius: 16px 16px 0 0;
    }
    .header h2 { font-size: 1.2rem; color: #4da6ff; }
    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bot { background: #2b2b3d; align-self: flex-start; color: #e1e1e6; }
    .user { background: #007bff; align-self: flex-end; color: #fff; }
    .input-box {
      padding: 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #2d2d3f;
      background: #252536;
      border-radius: 0 0 16px 16px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #3d3d52;
      border-radius: 8px;
      background: #121218;
      color: #fff;
      outline: none;
    }
    button {
      padding: 12px 20px;
      background: #007bff;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="header">
      <h2>Telepatheia - Class 10D 🤖</h2>
    </div>
    <div class="messages" id="chat">
      <div class="msg bot">Hello! Think of anyone in Class 10D and type <strong>Start game</strong> to begin!</div>
    </div>
    <form class="input-box" onsubmit="sendMessage(event)">
      <input type="text" id="userInput" placeholder="Type your answer..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // Points to the proxy endpoint configured in server.js
    const CHAT_API_URL = "/api/chat";

    // Manage or generate session ID for persistent Dialogflow context
    let sessionId = localStorage.getItem("telepatheia_session_id");
    if (!sessionId) {
      sessionId = "session-" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("telepatheia_session_id", sessionId);
    }

    async function sendMessage(event) {
      if (event) event.preventDefault();

      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      // Generate a fresh session ID whenever a brand new game starts
      if (text.toLowerCase().includes("start")) {
        sessionId = "session-" + Math.random().toString(36).substring(2, 9);
        localStorage.setItem("telepatheia_session_id", sessionId);
      }

      appendMessage(text, "user");
      input.value = "";

      try {
        const response = await fetch(CHAT_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            sessionId: sessionId
          })
        });

        const data = await response.json();
        const reply = data.fulfillmentText || "No response received.";
        appendMessage(reply, "bot");
      } catch (err) {
        appendMessage("⚠️ Could not connect to backend. Make sure the server is awake!", "bot");
      }
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById("chat");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;

      // Convert basic markdown formatting like **bold** to HTML
      let formattedText = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');

      msgDiv.innerHTML = formattedText;
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
